name: Windows Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Set version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}" -replace "^v", ""
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore DS4WindowsWPF.sln

      - name: Build application
        run: >
          dotnet build
          DS4Windows/DS4WinWPF.csproj
          --configuration Release
          --runtime win-x64
          -p:Platform=x64
          -p:Version=${{ steps.version.outputs.version }}
          --no-restore

      - name: Build tests
        run: >
          dotnet build
          DS4WindowsTests/DS4WindowsTests.csproj
          --configuration Release
          -p:Platform=x64
          --no-restore

      - name: Test
        run: >
          dotnet test
          DS4WindowsTests/DS4WindowsTests.csproj
          --configuration Release
          -p:Platform=x64
          --no-build
          --logger "trx;LogFileName=test_results.trx"

      - name: Publish
        run: >
          dotnet publish
          DS4Windows/DS4WinWPF.csproj
          --configuration Release
          --runtime win-x64
          -p:Platform=x64
          -p:Version=${{ steps.version.outputs.version }}
          --output artifacts/app
          --no-build

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "artifacts/app/*" `
            -DestinationPath "artifacts/DS4Windows-${{ steps.version.outputs.version }}-win-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: DS4Windows-${{ steps.version.outputs.version }}-win-x64
          path: artifacts/DS4Windows-*.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: DS4Windows v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/DS4Windows-*.zip
